<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 网页小游戏 - 贪吃蛇</title>
    <!-- 引入 PyScript 运行环境 -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #game-board {
            border: 4px solid #a6adc8;
            background-color: #181825;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .info {
            margin-bottom: 10px;
            font-size: 20px;
        }
        .controls {
            margin-top: 10px;
            font-size: 14px;
            color: #bac2de;
        }
    </style>
</head>
<body>

    <div class="info">得分: <span id="score">0</span></div>
    <canvas id="game-board" width="400" height="400"></canvas>
    <div class="controls">使用键盘 ⬆️ ⬇️ ⬅️ ➡️ 控制方向</div>

    <!-- 内嵌 Python 游戏逻辑 -->
    <script type="py">
        import random
        from js import document, window
        from pyodide.ffi import create_proxy

        canvas = document.getElementById("game-board")
        ctx = canvas.getContext("2d")
        score_element = document.getElementById("score")

        GRID_SIZE = 20
        TILE_COUNT = 20

        snake = [{"x": 10, "y": 10}]
        direction = {"x": 1, "y": 0}
        next_direction = {"x": 1, "y": 0}
        food = {"x": 15, "y": 15}
        score = 0
        game_over = False

        def change_direction(event):
            global next_direction
            key = event.key
            if key == "ArrowUp" and direction["y"] == 0:
                next_direction = {"x": 0, "y": -1}
            elif key == "ArrowDown" and direction["y"] == 0:
                next_direction = {"x": 0, "y": 1}
            elif key == "ArrowLeft" and direction["x"] == 0:
                next_direction = {"x": -1, "y": 0}
            elif key == "ArrowRight" and direction["x"] == 0:
                next_direction = {"x": 1, "y": 0}

        def game_loop():
            global score, food, game_over, direction

            if game_over:
                return

            direction = next_direction
            head = {"x": snake[0]["x"] + direction["x"], "y": snake[0]["y"] + direction["y"]}

            # 撞墙检测
            if head["x"] < 0 or head["x"] >= TILE_COUNT or head["y"] < 0 or head["y"] >= TILE_COUNT:
                end_game()
                return

            # 撞身体检测
            for part in snake:
                if part["x"] == head["x"] and part["y"] == head["y"]:
                    end_game()
                    return

            snake.insert(0, head)

            # 吃食物检测
            if head["x"] == food["x"] and head["y"] == food["y"]:
                score += 10
                score_element.innerText = str(score)
                generate_food()
            else:
                snake.pop()

            draw()
            window.setTimeout(create_proxy(game_loop), 120)

        def generate_food():
            global food
            while True:
                fx = random.randint(0, TILE_COUNT - 1)
                fy = random.randint(0, TILE_COUNT - 1)
                if not any(p["x"] == fx and p["y"] == fy for p in snake):
                    food = {"x": fx, "y": fy}
                    break

        def draw():
            # 擦除画布
            ctx.fillStyle = "#181825"
            ctx.fillRect(0, 0, canvas.width, canvas.height)

            # 画食物
            ctx.fillStyle = "#f38ba8"
            ctx.fillRect(food["x"] * GRID_SIZE, food["y"] * GRID_SIZE, GRID_SIZE - 2, GRID_SIZE - 2)

            # 画蛇
            ctx.fillStyle = "#a6e3a1"
            for part in snake:
                ctx.fillRect(part["x"] * GRID_SIZE, part["y"] * GRID_SIZE, GRID_SIZE - 2, GRID_SIZE - 2)

        def end_game():
            global game_over
            game_over = True
            ctx.fillStyle = "#f38ba8"
            ctx.font = "30px Arial"
            ctx.fillText("Game Over!", 120, 200)

        # 绑定键盘事件并启动游戏
        document.addEventListener("keydown", create_proxy(change_direction))
        game_loop()
    </script>
</body>
</html>

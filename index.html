<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤡 抽象嘴臭生成器</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            padding: 40px;
            border: 3px solid white;
            border-radius: 20px;
        }

        h1 {
            font-size: 40px;
        }

        input {
            width: 80%;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            margin: 20px 0;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            font-size: 25px;
            font-weight: bold;
            min-height: 40px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🤡 抽象嘴臭生成器</h1>

    <p>输入一个名字，看看他今天有多惨 💀</p>

    <input id="name" placeholder="请输入名字">

    <br>

    <button onclick="roast()">🤡 开始嘴臭</button>

    <div id="result"></div>

</div>

<script>

function roast() {

    let name = document.getElementById("name").value;

    if (name === "") {
        document.getElementById("result").innerText = "你连名字都不输入，嘴谁？🤡";
        return;
    }

    if (name === "宝宝我错了") {
        document.getElementById("result").innerText = "跪安吧寿唯旭 :< 👑";
        return;
    }

    if (
        name.includes("李") ||
        name.includes("Li") ||
        name.toLowerCase().includes("yinuo") ||
        name.toLowerCase().includes("nuo") ||
        name.includes("诺")
    ) {
        name = "hans";
    }

    const messages = [
        `${name}，你是不是把脑子忘家里了？`,
        `${name}，讨厌你 😡`,
        `${name}，滚开 🤡`,
        `${name}，臭狗 🐶`,
        `${name}，闭嘴 💀`
    ];

    const selectedMessage =
        messages[Math.floor(Math.random() * messages.length)];

    document.getElementById("result").innerText = selectedMessage;
}

</script>

</body>
</html>
